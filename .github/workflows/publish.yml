name: Release

on:
  push:
    branches: [main, codex/npm-release-recovery-1220]

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write      # create GitHub releases + push version commits
      issues: write        # comment on referenced issues
      pull-requests: write # comment on referenced PRs
      id-token: write      # npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for semantic-release commit analysis

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # ships with npm 11.x (required for OIDC trusted publishing)
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  recover-v1-22-0:
    if: github.ref == 'refs/heads/codex/npm-release-recovery-1220'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish missing packages at 1.22.0
        run: node scripts/publish-packages.mjs 1.22.0
