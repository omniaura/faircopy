name: Recover npm release 1.22.0

on:
  push:
    branches:
      - codex/npm-release-recovery-1220
    paths:
      - .github/workflows/recover-npm-release-1220.yml

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish missing 1.22.0 packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish missing packages at 1.22.0
        run: node scripts/publish-packages.mjs 1.22.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
